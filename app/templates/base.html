<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">

    <style>
        /* Modern CSS Reset and Base */
        :root {
            --primary-color: #667eea;
            --primary-dark: #5a67d8;
            --secondary-color: #764ba2;
            --accent-color: #f093fb;
            --success-color: #48bb78;
            --warning-color: #ed8936;
            --danger-color: #f56565;
            --dark-color: #2d3748;
            --light-color: #f7fafc;
            --border-color: #e2e8f0;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 0.5rem;
            --border-radius-lg: 0.75rem;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            padding-top: 76px; /* Space for fixed navbar */
            padding-bottom: 120px; /* Space for fixed footer */
            min-height: 100vh;
        }

        /* Main container that holds everything */
        .main-container {
            min-height: calc(100vh - 196px); /* Full height minus navbar and footer */
            display: flex;
            flex-direction: column;
        }

        /* Layout Structure */
        .page-wrapper {
            background: white;
            border-radius: 1rem 1rem 0 0;
            box-shadow: var(--shadow-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1;
            padding: 2rem 0;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-md);
            padding: 1rem 0;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
        }

        .navbar-nav .nav-link {
            color: var(--text-primary) !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: var(--border-radius);
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            background: var(--primary-color);
            color: white !important;
            transform: translateY(-1px);
        }

        .dropdown-menu {
            border: none;
            box-shadow: var(--shadow-lg);
            border-radius: var(--border-radius);
        }

        .dropdown-item {
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }

        .dropdown-item:hover {
            background: var(--primary-color);
            color: white;
        }

        /* Chart Containers */
        .chart-container {
            position: relative;
            height: 400px;
            margin: 2rem 0;
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        /* Export Section */
        .export-section {
            background: linear-gradient(135deg, var(--light-color) 0%, #edf2f7 100%);
            padding: 2rem;
            border-radius: var(--border-radius-lg);
            margin: 2rem 0;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .export-btn {
            margin: 0.25rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Analytics Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .metric-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
        }

        /* Tab Styling */
        .nav-tabs {
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .nav-tabs .nav-link {
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 1rem 1.5rem;
            margin-right: 0.5rem;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            transition: all 0.3s ease;
        }

        .nav-tabs .nav-link.active {
            background: var(--primary-color);
            color: white;
            border-bottom: 3px solid var(--primary-dark);
        }

        .nav-tabs .nav-link:hover {
            background: var(--light-color);
            color: var(--primary-color);
        }

        .tab-content {
            padding: 1rem 0;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            margin: 2rem 0;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        /* Messages */
        .error-message, .success-message {
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            margin: 1rem 0;
            font-weight: 500;
            border-left: 4px solid;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            border-left-color: var(--danger-color);
        }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            border-left-color: var(--success-color);
        }

        /* Card Improvements */
        .card {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-bottom: none;
            font-weight: 600;
            padding: 1.25rem 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        /* Button Improvements */
        .btn {
            border-radius: var(--border-radius);
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
            text-transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Form Improvements */
        .form-control {
            border-radius: var(--border-radius);
            border: 2px solid var(--border-color);
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Footer */
        .footer {
            background: linear-gradient(135deg, var(--dark-color), #1a202c) !important;
            border-radius: 0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }

        .footer a {
            color: #cbd5e0 !important;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--accent-color) !important;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .page-wrapper {
                margin-top: 66px;
            }

            .content-wrapper {
                padding: 1rem 0;
            }

            .analytics-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .metric-card {
                padding: 1.5rem;
            }

            .metric-value {
                font-size: 2rem;
            }

            .chart-container {
                height: 300px;
                padding: 1rem;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.6s ease-out;
        }

        /* Utility Classes */
        .text-gradient {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>

    <title>{% block title %}YouTube Playlist Analyzer{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='logo_title.jpeg') }}">
</head>

<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-md fixed-top">
            <div class="container">
                <a class="navbar-brand mr-4" href="{{ url_for('home.home') }}">
                    <i class="fab fa-youtube text-danger mr-2"></i>
                    <span class="text-gradient">Playlist Analyzer</span>
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" 
                        style="border: 2px solid var(--primary-color); border-radius: 0.5rem;">
                    <span style="background-image: url('data:image/svg+xml,%3csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'30\' height=\'30\' viewBox=\'0 0 30 30\'%3e%3cpath stroke=\'%23667eea\' stroke-linecap=\'round\' stroke-miterlimit=\'10\' stroke-width=\'2\' d=\'M4 7h22M4 15h22M4 23h22\'/%3e%3c/svg%3e');"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="exportDropdown" role="button" data-toggle="dropdown">
                                <i class="fas fa-download mr-1"></i> Export Data
                            </a>
                            <div class="dropdown-menu dropdown-menu-right">
                                <h6 class="dropdown-header"><i class="fas fa-file-export"></i> Export Formats</h6>
                                <a class="dropdown-item" href="#" onclick="exportData('csv')">
                                    <i class="fas fa-file-csv text-success mr-2"></i> CSV Format
                                </a>
                                <a class="dropdown-item" href="#" onclick="exportData('excel')">
                                    <i class="fas fa-file-excel text-success mr-2"></i> Excel Spreadsheet
                                </a>
                                <a class="dropdown-item" href="#" onclick="exportData('json')">
                                    <i class="fas fa-file-code text-info mr-2"></i> JSON Data
                                </a>
                            </div>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://github.com/805karansaini/youtube_playlist_analyser" target="_blank" 
                               title="View Source Code">
                                <i class="fab fa-github mr-1"></i> Source
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-container">
        <div class="page-wrapper">
            <main class="content-wrapper">
                {% block content %}{% endblock %}
            </main>
        </div>
        
        <footer class="footer">
            <div class="container py-4">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center text-md-left">
                        <h6 class="mb-2" style="color: #e2e8f0; font-weight: 600;">
                            <i class="fab fa-youtube text-danger mr-2"></i>
                            YouTube Playlist Analyzer
                        </h6>
                        <p class="mb-0" style="color: #a0aec0; font-size: 0.9rem;">
                            Made with <i class="fas fa-heart text-danger mx-1"></i> by 
                            <a href="https://github.com/805karansaini/" target="_blank">Karan Saini</a>
                        </p>
                    </div>
                    <div class="col-md-6 text-center text-md-right mt-3 mt-md-0">
                        <div class="social-links">
                            <a href="https://github.com/805karansaini" target="_blank" class="mr-3" title="GitHub Profile">
                                <i class="fab fa-github fa-lg"></i>
                            </a>
                            <a href="https://www.linkedin.com/in/805karansaini/" target="_blank" class="mr-3" title="LinkedIn Profile">
                                <i class="fab fa-linkedin fa-lg"></i>
                            </a>
                            <a href="https://github.com/805karansaini/youtube_playlist_analyser" target="_blank" title="Source Code">
                                <i class="fas fa-code fa-lg"></i>
                            </a>
                        </div>
                        <div class="mt-2">
                            <small style="color: #718096;">
                                © 2024 | Open Source Project
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

    <script>
        // Fallback export function for when no analysis data is available
        if (typeof window.exportData === 'undefined') {
            window.exportData = function(format) {
                alert('Please analyze a playlist first before exporting data.');
            };
        }
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
